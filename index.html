<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aniss Immobilier 27 | Mostaganem & Oran</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --navy:#0E2237; --navy2:#17334F; --gold:#B8893F; --goldtxt:#8A6322;
  --bg:#F2F4F7; --card:#FFFFFF; --ink:#0E2237; --muted:#586878; --line:#DCE2E9; --field:#F7F8FA;
  --nav:#0E2237; --navfg:#F4F1EA;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0A1520; --card:#12263A; --ink:#EDEFF2; --muted:#9DB0C2; --line:#223A52; --field:#0E1E2E;
    --goldtxt:#DDB36A; --nav:#07101A;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1520; --card:#12263A; --ink:#EDEFF2; --muted:#9DB0C2; --line:#223A52; --field:#0E1E2E;
  --goldtxt:#DDB36A; --nav:#07101A;
}
html{height:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Inter","Tajawal",system-ui,sans-serif;font-size:16px;line-height:1.6;padding-bottom:84px;-webkit-tap-highlight-color:transparent}
html[lang="ar"] body{font-family:"Tajawal","Inter",system-ui,sans-serif;font-size:17px}
h1,h2,h3,p{margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--nav);color:var(--navfg)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:56px}
.brand{font-weight:800;font-size:18px;letter-spacing:.2px}
.brand span{color:var(--gold)}
.lang{border:1px solid rgba(255,255,255,.35);background:transparent;color:var(--navfg);border-radius:20px;padding:4px 14px;font-size:14px;font-weight:600}

/* hero */
.hero{background:
  radial-gradient(circle at 85% 0%,rgba(184,137,63,.28),transparent 55%),
  repeating-linear-gradient(135deg,rgba(255,255,255,.035) 0 2px,transparent 2px 22px),
  var(--nav);
  color:var(--navfg);padding:28px 0 34px}
.hero h1{font-size:clamp(25px,6vw,42px);line-height:1.25;font-weight:800;max-width:20em}
.hero p.sub{opacity:.82;margin:10px 0 20px;max-width:34em}
.sbox{background:var(--card);color:var(--ink);border-radius:14px;padding:12px;box-shadow:0 14px 34px rgba(0,0,0,.28)}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--field);border:1px solid var(--line);border-radius:10px;padding:3px;margin-bottom:10px}
.tabs button{border:0;background:transparent;border-radius:8px;height:40px;font-weight:700;color:var(--muted)}
.tabs button.on{background:var(--nav);color:#fff}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(min-width:760px){.fgrid{grid-template-columns:repeat(3,1fr)}}
.fgrid label{display:block;font-size:12px;color:var(--muted);margin-bottom:1px;font-weight:600}
.fgrid select{width:100%;height:46px;border:1px solid var(--line);border-radius:10px;background:var(--field);padding:0 8px;font-size:15px}
.go{grid-column:1/-1;height:50px;border:0;border-radius:10px;background:var(--gold);color:#fff;font-weight:800;font-size:17px}
.go:active{filter:brightness(.92)}

/* listings */
.views>section{display:none;padding:22px 0 10px}
.views>section.on{display:block}
.rhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.rhead b{font-size:18px}
.link{background:none;border:0;color:var(--goldtxt);font-weight:700;padding:6px}
.grid{display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:700px){.grid{grid-template-columns:1fr 1fr}}
@media(min-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}}
.prop{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column}
.imgbox{position:relative}
.art{display:block;width:100%;aspect-ratio:16/10}
.bt,.bd{position:absolute;top:10px;font-size:13px;font-weight:700;padding:1px 10px;border-radius:6px}
.bt{inset-inline-start:10px;background:var(--nav);color:#fff}
.bd{inset-inline-end:10px;background:var(--gold);color:#fff}
.pb{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px}
.price{font-size:21px;font-weight:800;color:var(--goldtxt)}
.price small{display:block;font-size:12px;font-weight:500;color:var(--muted)}
.ptitle{font-weight:700}
.loc{color:var(--muted);font-size:14px}
.ico{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:14px;margin-top:2px}
.ico span{display:inline-flex;align-items:center;gap:4px}
.ico svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8}
.acts{display:flex;gap:8px;margin-top:8px}
.acts a{flex:1;text-align:center;text-decoration:none;font-weight:700;font-size:14px;height:38px;line-height:36px;border-radius:9px;border:1.5px solid var(--nav);color:var(--ink)}
.acts a.w{background:#1E8E4E;border-color:#1E8E4E;color:#fff}
.empty{grid-column:1/-1;text-align:center;padding:34px 16px;color:var(--muted);border:1.5px dashed var(--line);border-radius:14px}

/* generic */
h2.t{font-size:clamp(22px,4.5vw,30px);font-weight:800;margin-bottom:4px}
p.lead{color:var(--muted);margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.fld{display:block;margin-bottom:12px}
.fld span{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:2px}
.fld input,.fld select{width:100%;height:48px;border:1px solid var(--line);border-radius:10px;background:var(--field);padding:0 12px}
.fld input.err{border-color:#C0392B}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:50px;border:0;border-radius:10px;font-weight:800;text-decoration:none;color:#fff;background:var(--gold);padding:0 18px}
.btn.wa{background:#1E8E4E}.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.row{display:flex;gap:10px}.row>*{flex:1}

/* map */
.mapbox{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.mapbox svg{display:block;width:100%;height:auto}
.mapbox text{font-family:inherit}
.pin{cursor:pointer}
.note{font-size:13px;color:var(--muted);padding:8px 14px}

/* sell stepper */
.dots{display:flex;gap:6px;margin-bottom:14px}
.dots i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.dots i.on{background:var(--gold)}
.stp{display:none}.stp.on{display:block}
.stp h3{margin-bottom:10px;font-size:18px}

/* pro */
.svc{display:grid;gap:12px;margin-bottom:18px}
@media(min-width:760px){.svc{grid-template-columns:repeat(3,1fr)}}
.svc .card{border-inline-start:4px solid var(--gold)}
.svc h3{font-size:18px;margin-bottom:4px}
.svc p{color:var(--muted);font-size:15px}

/* detail sheet */
.sheet{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;display:none;padding-top:env(safe-area-inset-top,0px)}
.sheet.on{display:block}
.shbar{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;background:var(--nav);color:var(--navfg);padding:8px 14px;height:52px}
.shbar button{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:20px;padding:5px 16px;font-weight:700}
.slider{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;position:relative}
.slider::-webkit-scrollbar{display:none}
.slider .art{flex:0 0 100%;scroll-snap-align:center}
.cnt{position:absolute;inset-inline-end:12px;margin-top:-34px;float:right;background:rgba(0,0,0,.55);color:#fff;font-size:13px;border-radius:12px;padding:0 10px}
.shc{max-width:760px;margin:0 auto;padding:16px 16px 120px}
table.sp{width:100%;border-collapse:collapse}
table.sp td{padding:9px 4px;border-bottom:1px solid var(--line)}
table.sp td:first-child{color:var(--muted);width:42%}
table.sp td:last-child{font-weight:600}
.sec{margin-top:22px}
.sec h3{font-size:18px;margin-bottom:8px}
.roi input{height:44px}
.res{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:6px}
.res div{background:var(--field);border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}
.res b{display:block;font-size:19px;color:var(--goldtxt)}
.res span{font-size:12px;color:var(--muted)}
.shact{position:fixed;inset-inline:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;max-width:760px;margin:0 auto}
.shact .btn{flex:1;height:48px}

/* floating + bottom nav */
.fab{position:fixed;inset-inline-end:14px;bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;flex-direction:column;gap:10px}
.fab a{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(0,0,0,.3);background:var(--nav);color:#fff}
.fab a.w{background:#1E8E4E}
.fab svg{width:26px;height:26px;fill:#fff}
.bn{position:fixed;inset-inline:0;bottom:0;z-index:40;background:var(--nav);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
.bn button{background:none;border:0;color:rgba(244,241,234,.65);display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 0 7px;font-size:12px;font-weight:600}
.bn button svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8}
.bn button.on{color:var(--gold)}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>

var LANG="fr";
try{LANG=localStorage.getItem('ai27lang')||((navigator.language||'').indexOf('ar')==0?'ar':'fr');}catch(e){LANG=((navigator.language||'').indexOf('ar')==0?'ar':'fr');}
function t(k){return (T[LANG]&&T[LANG][k])||T.fr[k]||k;}

/* ============ helpers ============ */
var $=function(i){return document.getElementById(i)};
var S={deal:'buy',city:'',q:'',type:'',max:0,rf:''};
var openId=0;
function fmt(n){return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,"\u00A0");}
function typeLbl(p){return t(p.type);}
function title(p){return typeLbl(p)+((p.type=='apt'||p.type=='villa')?' F'+p.rooms:'')+' – '+t('n_'+p.q);}
function floorStr(p){return p.floor===null?'–':(p.floor===0?t('rdc'):p.floor);}
function priceHtml(p){
  if(p.deal=='rent') return fmt(p.price)+' DZD <small>'+t('per_month')+'</small>';
  return fmt(p.price)+' DZD<small>≈ '+fmt(p.price/10000)+' '+t('millions')+'</small>';
}
function ref(p){return 'AI27-'+('00'+p.id).slice(-3);}
function wa(msg){return 'https://wa.me/'+PHONE_INT+'?text='+encodeURIComponent(msg);}
var IC={
 area:'<svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="1"/><path d="M4 9h5M15 4v5"/></svg>',
 floor:'<svg viewBox="0 0 24 24"><path d="M3 20h18M6 20V8h12v12M9 12h6M9 16h6"/></svg>',
 fac:'<svg viewBox="0 0 24 24"><path d="M4 20V6l8-3 8 3v14M9 20v-6h6v6"/></svg>'
};

    s+='<rect x="0" y="150" width="320" height="50" fill="'+c+'" opacity=".3"/><rect x="40" y="35" width="90" height="80" rx="3" fill="#fff" opacity=".75"/><path d="M85 35v80M40 75h90" stroke="'+c+'" stroke-width="3"/>'
      +'<rect x="160" y="105" width="120" height="45" rx="8" fill="'+c+'"/><rect x="150" y="125" width="20" height="25" rx="6" fill="'+c+'"/><rect x="270" y="125" width="20" height="25" rx="6" fill="'+c+'"/><rect x="205" y="55" width="50" height="35" fill="'+c+'" opacity=".4"/>';
  } else if(v==2){ // plan

  } else {

    else if(p.type=='villa') s+='<rect x="80" y="100" width="160" height="68" fill="'+c+'"/><path d="M68 104L160 50l92 54z" fill="'+c+'" opacity=".75"/><rect x="146" y="128" width="28" height="40" fill="#fff" opacity=".85"/><rect x="95" y="118" width="32" height="22" fill="#fff" opacity=".8"/><rect x="193" y="118" width="32" height="22" fill="#fff" opacity=".8"/>';
    else if(p.type=='land') s+='<path d="M40 168L92 108h136l52 60z" fill="'+c+'" opacity=".8"/><path d="M160 108v60M120 108l-22 60M200 108l22 60" stroke="#fff" stroke-width="2" opacity=".6"/>';
    else s+='<rect x="70" y="80" width="180" height="88" fill="'+c+'"/><path d="M64 80h192l-14 26H78z" fill="#fff" opacity=".8"/><rect x="92" y="116" width="76" height="52" fill="#fff" opacity=".8"/><rect x="186" y="116" width="44" height="52" fill="#fff" opacity=".5"/>';
  }
  return s+'</svg>';

/* ============ search & filtering (core) ============ */
function roomOk(p){
  if(!S.rf) return true;
  var n=+S.rf.slice(1);
  return S.rf.charAt(0)=='r' ? p.rooms>=n : p.fac>=n;
}
function filtered(){
  return PROPS.filter(function(p){
    return p.deal==S.deal
      && (!S.city || CITY_OF[p.q]==S.city)
      && (!S.q || p.q==S.q)
      && (!S.type || p.type==S.type)
      && (!S.max || p.price<=S.max)
      && roomOk(p);
  });
}
function card(p){
  return '<article class="prop" tabindex="0" data-id="'+p.id+'"><div class="imgbox">'+art(p,0)
   +'<span class="bt">'+((p.type=='apt'||p.type=='villa')?(p.type=='villa'?t('villa')+' ':'')+'F'+p.rooms:typeLbl(p))+'</span><span class="bd">'+t('doc_'+p.doc)+'</span></div>'
   +'<div class="pb"><div class="price">'+priceHtml(p)+'</div><div class="ptitle">'+title(p)+'</div><div class="loc">'+t('n_'+p.q)+', '+t('n_'+CITY_OF[p.q])+'</div>'
   +'<div class="ico"><span>'+IC.area+p.surf+' m²</span>'+(p.floor!==null?'<span>'+IC.floor+floorStr(p)+'</span>':'')+'<span>'+IC.fac+p.fac+' '+t('s_fac').toLowerCase()+'</span></div>'
   +'<div class="acts"><a href="tel:'+PHONE_LOCAL+'">'+t('call')+'</a><a class="w" href="'+wa(t('wa_inq')+': '+title(p)+' ('+ref(p)+')')+'" target="_blank" rel="noopener">WhatsApp</a></div></div></article>';
}
function renderList(){
  var l=filtered();
  $('count').textContent=l.length+' '+t('results');
  $('grid').innerHTML=l.length?l.map(card).join(''):'<div class="empty">'+t('no_results')+'</div>';
}

/* ============ selects ============ */
function opt(v,l,sel){return '<option value="'+v+'"'+(sel?' selected':'')+'>'+l+'</option>';}
function buildSelects(){
  $('fCity').innerHTML=opt('',t('all_cities'),!S.city)+['mos','ora'].map(function(c){return opt(c,t('n_'+c),S.city==c)}).join('');
  var qs=Object.keys(CITY_OF).filter(function(q){return !S.city||CITY_OF[q]==S.city});
  $('fQ').innerHTML=opt('',t('all_q'),!S.q)+qs.map(function(q){return opt(q,t('n_'+q),S.q==q)}).join('');
  $('fType').innerHTML=opt('',t('all_types'),!S.type)+['apt','villa','shop','land'].map(function(x){return opt(x,t(x),S.type==x)}).join('');
  $('fPrice').innerHTML=opt('0',t('any_price'),!S.max)+PRICES[S.deal].map(function(v){return opt(v,'≤ '+fmt(v)+' DZD',S.max==v)}).join('');
  $('fRooms').innerHTML=opt('',t('any_rooms'),!S.rf)
    +'<optgroup label="'+t('rooms_g')+'">'+[2,3,4,5].map(function(n){return opt('r'+n,'F'+n+'+',S.rf=='r'+n)}).join('')+'</optgroup>'
    +'<optgroup label="'+t('fac_g')+'">'+[1,2,3].map(function(n){return opt('f'+n,n+'+ '+t('fac_g').toLowerCase(),S.rf=='f'+n)}).join('')+'</optgroup>';
  $('tBuy').className=S.deal=='buy'?'on':'';$('tRent').className=S.deal=='rent'?'on':'';
  // sell form selects
  var keep={d:$('sDeal').value,ty:$('sType').value,c:$('sCity').value};
  $('sDeal').innerHTML=opt('sell',t('sell_do'))+opt('rent',t('rent_do'));
  $('sType').innerHTML=['apt','villa','shop','land'].map(function(x){return opt(x,t(x))}).join('');
  $('sCity').innerHTML=['mos','ora'].map(function(c){return opt(c,t('n_'+c))}).join('');
  if(keep.d)$('sDeal').value=keep.d;if(keep.ty)$('sType').value=keep.ty;if(keep.c)$('sCity').value=keep.c;
}
function onFilter(){renderList();}
$('tBuy').onclick=function(){S.deal='buy';S.max=0;buildSelects();renderList();};
$('tRent').onclick=function(){S.deal='rent';S.max=0;buildSelects();renderList();};
$('fCity').onchange=function(){S.city=this.value;S.q='';buildSelects();renderList();};
$('fQ').onchange=function(){S.q=this.value;if(S.q)S.city=CITY_OF[S.q];buildSelects();renderList();};
$('fType').onchange=function(){S.type=this.value;renderList();};
$('fPrice').onchange=function(){S.max=+this.value;renderList();};
$('fRooms').onchange=function(){S.rf=this.value;renderList();};
$('go').onclick=function(){renderList();$('results').scrollIntoView({behavior:'smooth'});};
$('reset').onclick=function(){S.city='';S.q='';S.type='';S.max=0;S.rf='';buildSelects();renderList();};

/* ============ map ============ */
var PINS={akid:[70,175],belgaid:[115,215],bej:[150,160],salamandre:[235,125],kherrouba:[290,170],mazagran:[250,210]};
function renderMap(){
  var s='<svg viewBox="0 0 360 270"><rect width="360" height="270" fill="var(--field)"/>'
   +'<path d="M0 0h360v85C300 70 250 105 200 90S90 60 0 100z" fill="#2C6E8F" opacity=".35"/>'
   +'<path d="M0 100C90 60 150 95 200 90S300 70 360 85" fill="none" stroke="#2C6E8F" stroke-width="2" opacity=".6"/>'
   +'<text x="180" y="40" text-anchor="middle" font-size="13" fill="var(--muted)">'+(LANG=='ar'?'البحر الأبيض المتوسط':'Méditerranée')+'</text>'
   +'<text x="105" y="258" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink)">'+t('n_ora')+'</text>'
   +'<text x="260" y="258" text-anchor="middle" font-size="14" font-weight="700" fill="var(--ink)">'+t('n_mos')+'</text>'
   +'<path d="M190 105v150" stroke="var(--line)" stroke-dasharray="4 5"/>';
  Object.keys(PINS).forEach(function(q){
    var n=PROPS.filter(function(p){return p.q==q}).length,xy=PINS[q];
    s+='<g class="pin" data-q="'+q+'" tabindex="0" role="button" aria-label="'+t('n_'+q)+'"><circle cx="'+xy[0]+'" cy="'+xy[1]+'" r="15" fill="#B8893F"/><text x="'+xy[0]+'" y="'+(xy[1]+5)+'" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">'+n+'</text><text x="'+xy[0]+'" y="'+(xy[1]+31)+'" text-anchor="middle" font-size="12" font-weight="600" fill="var(--ink)">'+t('n_'+q)+'</text></g>';
  });
  $('mapsvg').innerHTML=s+'</svg>';
  Array.prototype.forEach.call(document.querySelectorAll('.pin'),function(g){
    var go=function(){S.q=g.getAttribute('data-q');S.city=CITY_OF[S.q];S.type='';S.max=0;S.rf='';buildSelects();renderList();showView('home');$('results').scrollIntoView();};
    g.onclick=go;g.onkeydown=function(e){if(e.key=='Enter'||e.key==' ')go();};
  });
}

/* ============ detail sheet ============ */
function openDetail(id){
  var p=PROPS.filter(function(x){return x.id==id})[0];if(!p)return;openId=id;
  var rent0=Math.round(p.price*0.05/12/1000)*1000;
  var h='<div class="shbar"><b>'+ref(p)+'</b><button type="button" id="shClose">'+t('close')+'</button></div>'
   +'<div class="slider" id="slider">'+art(p,0)+art(p,1)+art(p,2)+'</div><div class="cnt" id="cnt">1/3</div>'
   +'<div class="shc"><div class="price" style="font-size:26px">'+priceHtml(p)+'</div><h2 class="t" style="font-size:22px;margin-top:4px">'+title(p)+'</h2>'
   +'<p class="loc">'+t('n_'+p.q)+', '+t('n_'+CITY_OF[p.q])+'</p>'
   +'<div class="sec"><a class="btn ghost" style="width:100%" href="'+VIDEO_URL+'" target="_blank" rel="noopener">'+t('video')+'</a></div>'
   +'<div class="sec"><h3>'+t('specs')+'</h3><table class="sp">'
   +'<tr><td>'+t('s_loc')+'</td><td>'+t('n_'+p.q)+', '+t('n_'+CITY_OF[p.q])+'</td></tr>'
   +'<tr><td>'+t('s_type')+'</td><td>'+typeLbl(p)+'</td></tr>'
   +(p.rooms?'<tr><td>'+t('s_rooms')+'</td><td>F'+p.rooms+'</td></tr>':'')
   +(p.floor!==null?'<tr><td>'+t('s_floor')+'</td><td>'+floorStr(p)+'</td></tr>':'')
   +'<tr><td>'+t('s_surf')+'</td><td>'+p.surf+' m²</td></tr>'
   +'<tr><td>'+t('s_fac')+'</td><td>'+p.fac+'</td></tr>'
   +'<tr><td>'+t('s_doc')+'</td><td>'+t('doc_'+p.doc)+'</td></tr>'
   +'<tr><td>'+t('s_ref')+'</td><td>'+ref(p)+'</td></tr></table></div>'
   +(p.deal=='buy'?'<div class="sec card roi"><h3>'+t('roi')+'</h3>'
    +'<label class="fld"><span>'+t('roi_price')+'</span><input id="rPrice" inputmode="numeric" value="'+p.price+'"></label>'
    +'<label class="fld"><span>'+t('roi_rent')+'</span><input id="rRent" inputmode="numeric" value="'+rent0+'"></label>'
    +'<label class="fld"><span>'+t('roi_chg')+'</span><input id="rChg" inputmode="numeric" value="10"></label>'
    +'<div class="res"><div><b id="oG">–</b><span>'+t('roi_gross')+'</span></div><div><b id="oN">–</b><span>'+t('roi_net')+'</span></div><div><b id="oP">–</b><span>'+t('roi_pay')+'</span></div></div></div>':'')
   +'<div class="sec card"><h3>'+t('book')+'</h3><label class="fld"><span>'+t('visit_date')+'</span><input id="vDate" type="date"></label>'
   +'<button class="btn" type="button" id="vSend" style="width:100%">'+t('send_visit')+'</button></div></div>'
   +'<div class="shact"><a class="btn ghost" href="tel:'+PHONE_LOCAL+'">'+t('call')+'</a><a class="btn wa" href="'+wa(t('wa_inq')+': '+title(p)+' ('+ref(p)+')')+'" target="_blank" rel="noopener">WhatsApp</a></div>';
  var sh=$('sheet');sh.innerHTML=h;sh.classList.add('on');document.body.style.overflow='hidden';sh.scrollTop=0;
  $('shClose').onclick=closeDetail;
  var sl=$('slider');sl.onscroll=function(){var i=Math.round(Math.abs(sl.scrollLeft)/sl.clientWidth)+1;$('cnt').textContent=i+'/3';};
  $('vSend').onclick=function(){var d=$('vDate').value||'-';window.open(wa(t('bon')+' – '+title(p)+' ('+ref(p)+') – '+t('visit_date')+': '+d),'_blank');};
  if(p.deal=='buy'){
    var calc=function(){
      var pr=+$('rPrice').value||0,rt=+$('rRent').value||0,ch=+$('rChg').value||0;
      var yr=rt*12,net=yr*(1-ch/100);
      $('oG').textContent=pr?(yr/pr*100).toFixed(1)+'%':'–';
      $('oN').textContent=pr?(net/pr*100).toFixed(1)+'%':'–';
      $('oP').textContent=net>0?(pr/net).toFixed(1)+' '+t('yrs'):'–';
    };
    ['rPrice','rRent','rChg'].forEach(function(i){$(i).oninput=calc});calc();
  }
}
function closeDetail(){$('sheet').classList.remove('on');document.body.style.overflow='';openId=0;}
document.addEventListener('keydown',function(e){if(e.key=='Escape')closeDetail();});

  if(e.target.closest('.acts a'))return;
  var c=e.target.closest('.prop');if(c)openDetail(+c.getAttribute('data-id'));

function goStep(n){
  stepEls.forEach(function(id,i){$(id).classList.toggle('on',i==n-1)});
  Array.prototype.forEach.call(document.querySelectorAll('.dots i'),function(d,i){d.classList.toggle('on',i<n)});
}
Array.prototype.forEach.call(document.querySelectorAll('[data-next]'),function(b){
  b.onclick=function(){
    var n=+b.getAttribute('data-next');
    if(n==2&&b.closest('#s1')){
      var bad=false;['sName','sPhone'].forEach(function(i){var e=$(i);var ok=e.value.trim().length>1;e.classList.toggle('err',!ok);if(!ok){bad=true}});
      if(bad){return;}
    }
    goStep(n);
  };
});
$('sSend').onclick=function(){
  var m=(LANG=='ar'?'إعلان جديد':'Dépôt d\'annonce')+'\n'+t('name')+': '+$('sName').value+'\n'+t('phone')+': '+$('sPhone').value
   +'\n'+t('deal')+': '+$('sDeal').selectedOptions[0].text+'\n'+t('type')+': '+$('sType').selectedOptions[0].text
   +'\n'+t('city')+': '+$('sCity').selectedOptions[0].text+'\n'+t('quartier_free')+': '+$('sQ').value+'\n'+t('asking')+': '+$('sPrice').value;
  window.open(wa(m),'_blank');
};
$('pSend').onclick=function(){window.open(wa(t('pro_title')+'\n'+t('company')+': '+$('pCo').value+'\n'+t('phone')+': '+$('pPh').value),'_blank');};

/* ============ language ============ */
function applyI18n(){
  Array.prototype.forEach.call(document.querySelectorAll('[data-i18n]'),function(e){e.textContent=t(e.getAttribute('data-i18n'))});
  $('langBtn').textContent=LANG=='fr'?'العربية':'Français';
  document.title='Aniss Immobilier 27 | '+t('n_mos')+' & '+t('n_ora');
}
function setLang(l){
  LANG=l;try{localStorage.setItem('ai27lang',l)}catch(e){}
  document.documentElement.lang=l;document.documentElement.dir=l=='ar'?'rtl':'ltr';
  applyI18n();buildSelects();renderList();renderMap();renderNav();
  if(openId)openDetail(openId);
}
$('langBtn').onclick=function(){setLang(LANG=='fr'?'ar':'fr')};
setLang(LANG);
</script>
